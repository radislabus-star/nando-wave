[package]
name = "nando-transition-serving"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.7"
bytes = "1"
memchr = "2"
mimalloc = "0.1"
nando-operator-admission = { path = "../nando-operator-admission" }
nando-operator-kernel = { path = "../nando-operator-kernel" }
nando-operator-learning = { path = "../nando-operator-learning" }
nando-operator-persistence = { path = "../nando-operator-persistence" }
nando-operator-proof = { path = "../nando-operator-proof" }
nando-operator-runtime = { path = "../nando-operator-runtime" }
nando-response-actor = { path = "../nando-response-actor" }
nando-expression-runtime = { path = "../nando-expression-runtime" }
nando-transition-inducer = { path = "../nando-transition-inducer" }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }
tiktoken-rs = "0.7"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

[lints]
workspace = true
