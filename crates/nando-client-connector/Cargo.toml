[package]
name = "nando-client-connector"
edition.workspace = true
license-file.workspace = true
publish.workspace = true
rust-version.workspace = true
version = "0.3.1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nando-connector"
path = "src/main.rs"

[dependencies]
httparse = "1"
nando-client-evidence = { path = "../nando-client-evidence" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.10"
webpki-roots = "1"

[lints]
workspace = true
