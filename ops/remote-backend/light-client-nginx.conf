worker_processes 1;
user www-data www-data;
pid /run/nando-gateway/nginx.pid;
error_log stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    access_log off;
    keepalive_timeout 75s;
    keepalive_requests 10000;
    client_max_body_size 64m;
    client_body_timeout 3600s;
    client_body_temp_path /var/lib/nando-gateway/client-body 1 2;
    proxy_temp_path /var/lib/nando-gateway/proxy 1 2;

    upstream nando_remote_backend {
        server 192.168.3.94:8787;
        keepalive 32;
    }

    map $http_upgrade $nando_connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 127.0.0.1:8787;
        server_name _;

        location / {
            proxy_pass http://nando_remote_backend;
            proxy_http_version 1.1;
            proxy_set_header Host 192.168.3.94;
            proxy_set_header Connection $nando_connection_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_pass_request_headers on;

            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_max_temp_file_size 0;
            gzip off;

            proxy_connect_timeout 2s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            send_timeout 3600s;
            proxy_next_upstream off;
        }
    }
}
