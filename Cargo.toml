[workspace]
members = [
    "crates/nando-core",
    "crates/nando-operator-kernel",
    "crates/nando-operator-proof",
    "crates/nando-operator-runtime",
    "crates/nando-operator-persistence",
    "crates/nando-operator-admission",
    "crates/nando-operator-learning",
    "crates/nando-cli",
    "crates/nando-eval",
    "crates/nando-transition-actor",
    "crates/nando-transition-inducer",
    "crates/nando-gateway-control",
    "crates/nando-transition-serving",
    "crates/nando-response-actor",
    "crates/nando-expression-runtime",
    "crates/nando-client-connector",
    "crates/nando-client-evidence",
]
resolver = "3"

[workspace.package]
edition = "2024"
license-file = "LICENSE-NONCOMMERCIAL.md"
publish = false
rust-version = "1.95"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

# Local checks are disposable. Keeping full debug symbols and per-crate
# incremental state made repeated test builds consume tens of GiB.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
